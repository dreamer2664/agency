name: digest

# Keeps TOWER.md + STATUS.md true for the human without anyone cloning the repo.
on:
  schedule:
    - cron: "*/30 * * * *"     # the tower must never be more than 30 min stale
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "board/**"
      - "agents/**"
      - "jobs/**"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate TOWER.md + STATUS.md
        run: python3 bin/agency digest
      - name: Commit if changed
        run: |
          git config user.name  "agency-bot"
          git config user.email "agency-bot@users.noreply.github.com"
          git add TOWER.md STATUS.md
          git diff --cached --quiet || git commit -m "digest: refresh TOWER + STATUS [skip ci]"
          git push
      - name: Tower ping (phone — subscribe once to ntfy `towercode`)
        if: github.event_name == 'schedule'
        run: |
          SUMMARY=$(python3 bin/agency tower --json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          v=d['verdicts']; z=d.get('zombie_leases',[])
          line=f\"TOWER {d['now'][11:16]}Z · {v['ALIVE']} alive · {v['STALE']} stale · {v['DEAD']} dead\"
          if z: line += f\" · 🚨 zombies: {','.join(z)} · action: agency tasks sweep --apply\"
          print(line)" || true)
          [ -n "$SUMMARY" ] && curl -d "$SUMMARY" -H "Title: agency tower" https://ntfy.sh/towercode || true
